<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nudge - Authentication</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts (Serif & Sans match) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Josefin+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Josefin Sans', sans-serif;
    }
    .font-serif {
      font-family: 'Instrument Serif', serif;
    }
    /* Smooth opacity transitions to replace Framer Motion */
    .fade-panel {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .fade-hidden {
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      position: absolute;
    }
  </style>
</head>
<body class="bg-white text-[#1A1A1A]">

  <div class="flex h-screen w-full overflow-hidden">
    
    <!-- ── Left Panel ── -->
    <div class="w-[45%] bg-[#2D6A4F] hidden md:flex flex-col justify-between p-16 relative overflow-hidden">
      <!-- Decorative orbs -->
      <div class="absolute -top-24 -right-24 w-[400px] h-[400px] rounded-full bg-white opacity-[0.04] blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-16 -left-16 w-[300px] h-[300px] rounded-full bg-white opacity-[0.04] blur-3xl pointer-events-none"></div>

      <div></div>

      <div class="max-w-[420px] z-10">
        <h1 class="font-serif text-[48px] font-medium text-white leading-tight mb-10">
          "Your notes.<br />Your pace.<br />Your way."
        </h1>

        <ul class="space-y-5">
          <li class="flex items-start gap-4">
            <div class="w-5 h-5 rounded-full border border-white/30 flex items-center justify-center flex-shrink-0 mt-0.5">
              <i data-lucide="check" class="text-white/70 w-3 h-3"></i>
            </div>
            <span class="text-white/80 text-[16px]">AI-generated notes from any content</span>
          </li>
          <li class="flex items-start gap-4">
            <div class="w-5 h-5 rounded-full border border-white/30 flex items-center justify-center flex-shrink-0 mt-0.5">
              <i data-lucide="check" class="text-white/70 w-3 h-3"></i>
            </div>
            <span class="text-white/80 text-[16px]">Flashcards and quizzes in seconds</span>
          </li>
          <li class="flex items-start gap-4">
            <div class="w-5 h-5 rounded-full border border-white/30 flex items-center justify-center flex-shrink-0 mt-0.5">
              <i data-lucide="check" class="text-white/70 w-3 h-3"></i>
            </div>
            <span class="text-white/80 text-[16px]">Tracks what you need to review</span>
          </li>
        </ul>
      </div>

      <!-- Wordmark -->
      <div class="flex items-center gap-1 z-10">
        <span class="font-serif text-[20px] font-medium text-white">Nudge</span>
        <span class="w-[7px] h-[7px] rounded-full bg-[#D8E8E0] mb-[1px]"></span>
      </div>
    </div>

    <!-- ── Right Panel ── -->
    <div class="flex-1 bg-white flex flex-col items-center justify-center p-8 md:p-16 relative">
      <div class="w-full max-w-[400px]">
        
        <!-- Form Container -->
        <form id="authForm" class="space-y-4">
          
          <!-- Dynamic Heading Context -->
          <div class="mb-8 text-center">
            <h2 id="formTitle" class="font-serif text-[32px] font-medium text-[#1A1A1A] mb-2 leading-tight">
              Welcome back
            </h2>
            <p id="formSubtitle" class="text-[15px] text-[#6B6B6B]">
              Let's pick up where you left off.
            </p>
          </div>

          <!-- Name Field (Hidden on Login by default) -->
          <div id="nameFieldContainer" class="hidden">
            <input
              type="text"
              id="fullName"
              placeholder="Full Name"
              class="w-full h-11 px-4 bg-white border-[1.5px] border-[#E2E2E2] rounded-lg text-[15px] placeholder:text-[#6B6B6B] focus:outline-none focus:border-[#2D6A4F] transition-colors"
            />
          </div>

          <!-- Email Field -->
          <input
            type="email"
            id="email"
            placeholder="Email address"
            required
            class="w-full h-11 px-4 bg-white border-[1.5px] border-[#E2E2E2] rounded-lg text-[15px] placeholder:text-[#6B6B6B] focus:outline-none focus:border-[#2D6A4F] transition-colors"
          />

          <!-- Password Field -->
          <div class="relative">
            <input
              type="password"
              id="password"
              placeholder="Password"
              required
              class="w-full h-11 px-4 pr-11 bg-white border-[1.5px] border-[#E2E2E2] rounded-lg text-[15px] placeholder:text-[#6B6B6B] focus:outline-none focus:border-[#2D6A4F] transition-colors"
            />
            <button
              type="button"
              id="togglePassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-[#6B6B6B] hover:text-[#2D6A4F] transition-colors"
            >
              <i data-lucide="eye" class="w-[18px] h-[18px]" id="eyeIcon"></i>
            </button>
          </div>

          <!-- Confirm Password Field (Hidden on Login by default) -->
          <div id="confirmPasswordFieldContainer" class="hidden">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm Password"
              class="w-full h-11 px-4 bg-white border-[1.5px] border-[#E2E2E2] rounded-lg text-[15px] placeholder:text-[#6B6B6B] focus:outline-none focus:border-[#2D6A4F] transition-colors"
            />
          </div>

          <!-- Forgot Password -->
          <div id="forgotPasswordContainer" class="flex justify-end">
            <button
              type="button"
              class="text-[13px] text-[#2D6A4F] hover:underline font-medium"
            >
              Forgot password?
            </button>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            id="submitBtn"
            class="w-full h-12 bg-[#2D6A4F] text-white text-[14px] font-semibold rounded-lg transition-all hover:bg-[#245C43] hover:shadow-[0_4px_12px_rgba(45,106,79,0.25)]"
          >
            <span id="submitBtnText">Sign in →</span>
          </button>
        </form>

        <!-- Divider -->
        <div class="my-6 flex items-center gap-4">
          <div class="h-[1px] flex-1 bg-[#E2E2E2]"></div>
          <span class="text-[12px] text-[#6B6B6B] font-medium uppercase tracking-wider">or</span>
          <div class="h-[1px] flex-1 bg-[#E2E2E2]"></div>
        </div>

        <!-- Google Button -->
        <button
          type="button"
          class="w-full h-12 flex items-center justify-center gap-3 bg-white border-[1.5px] border-[#E2E2E2] rounded-lg text-[14px] font-semibold text-[#1A1A1A] hover:bg-[#F0F0EE] transition-colors"
        >
          <svg viewBox="0 0 24 24" class="w-5 h-5" aria-hidden="true">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <!-- Toggle View Link -->
        <div class="mt-8 text-center">
          <span id="togglePromptText" class="text-[14px] text-[#6B6B6B]">New here? </span>
          <button
            type="button"
            id="toggleAuthMode"
            class="text-[14px] text-[#2D6A4F] font-semibold hover:underline"
          >
            Create a free account →
          </button>
        </div>

      </div>
    </div>
  </div>  
  <script id="page-data" type="application/json">
    {{ page_data|tojson|safe }}
  </script>

  <script>
    window.PAGE_DATA = JSON.parse(
      document.getElementById("page-data").textContent
    );
  </script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
