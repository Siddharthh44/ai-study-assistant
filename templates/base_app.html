<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Nudge{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  {% block head_extra %}{% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Josefin+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Josefin Sans', sans-serif; }
    .font-sans { font-family: 'Josefin Sans', sans-serif; }
    .font-serif { font-family: 'Instrument Serif', serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  {% block page_styles %}{% endblock %}
</head>
<body class="bg-[#F4F4F2] text-[#1A1A1A]">
  <div class="flex h-screen bg-[#F4F4F2] overflow-hidden font-sans">
    {% include "partials/sidebar.html" %}
    <div class="flex-1 flex flex-col h-full overflow-hidden">
      {% include "partials/navbar.html" %}
      <main class="flex-1 overflow-y-auto bg-[#F4F4F2] p-6 md:p-12">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script id="page-data" type="application/json">
    {{ page_data|tojson|safe }}
  </script>
  <script id="shell-data" type="application/json">
    {{ shell_data|tojson|safe }}
  </script>
  <script>
    window.PAGE_DATA = JSON.parse(document.getElementById("page-data").textContent);
    window.SHELL_DATA = JSON.parse(document.getElementById("shell-data").textContent);
  </script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/layout.js"></script>
  {% block page_scripts %}{% endblock %}
</body>
</html>
