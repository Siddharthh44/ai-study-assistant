{% extends "base_app.html" %}
{% block title %}Nudge - Bookmarks Dashboard{% endblock %}

{% block page_styles %}
  <style>
body { font-family: 'Josefin Sans', sans-serif; }
    .font-serif { font-family: 'Instrument Serif', serif; }
    .masonry-grid { column-count: 1; column-gap: 20px; }
    @media (min-width: 750px) { .masonry-grid { column-count: 2; } }
    @media (min-width: 1000px) { .masonry-grid { column-count: 3; } }
    .masonry-item { break-inside: avoid; margin-bottom: 20px; }
  </style>
{% endblock %}

{% block content %}
<div id="mainDashboard" class="max-w-6xl mx-auto space-y-6">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h1 class="font-serif text-[32px] font-medium text-[#1A1A1A] leading-tight">Your Bookmarks</h1>
        <p class="text-[15px] text-[#6B6B6B] mt-1">Quick access to your saved study materials.</p>
      </div>
      <div class="flex items-center gap-3 mt-2">
        <span class="text-[13px] font-medium text-[#6B6B6B]">Revision Mode</span>
        <button id="toggleRevisionModeBtn" class="relative w-10 h-[22px] rounded-full bg-[#E2E2E2] transition-colors flex-shrink-0 focus:outline-none">
          <span id="toggleCircle" class="absolute top-[3px] left-[3px] w-4 h-4 bg-white rounded-full shadow transition-transform pointer-events-none"></span>
        </button>
      </div>
    </div>

    <div class="flex flex-col md:flex-row gap-3">
      <div class="relative flex-1 max-w-xs">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-[#6B6B6B] w-4 h-4"></i>
        <input id="searchField" type="text" placeholder="Search bookmarks..." class="w-full pl-9 pr-4 h-10 bg-white border border-[#E2E2E2] rounded-lg text-[14px] placeholder:text-[#6B6B6B] focus:outline-none focus:border-[#2D6A4F] transition-colors">
      </div>
      <div id="filterButtonGroup" class="flex gap-2 flex-wrap"></div>
    </div>

    <div id="contentFeed"></div>
  </div>

  <div id="revisionOverlay" class="fixed inset-0 bg-[#F4F4F2] z-50 hidden flex-col items-center justify-center p-8">
    <div class="absolute top-6 right-6 flex items-center gap-3">
      <span id="overlayHeaderCounter" class="font-mono text-[11px] text-[#6B6B6B] tracking-[0.03em]"></span>
      <button id="closeOverlayBtn" class="text-[#6B6B6B] hover:text-[#1A1A1A] transition-colors focus:outline-none"><i data-lucide="x" class="w-[22px] h-[22px]"></i></button>
    </div>
    <div class="max-w-[680px] w-full">
      <div id="revisionFocusCard" class="bg-white rounded-xl border border-[#E2E2E2] border-l-[3px] p-8 shadow-sm"></div>
      <div class="flex items-center justify-between mt-8 px-2">
        <button id="prevRevisionBtn" class="text-[#6B6B6B] hover:text-[#2D6A4F] disabled:opacity-30 transition-colors text-[14px] font-medium">← Previous</button>
        <span id="overlayFooterCounter" class="font-mono text-[12px] text-[#6B6B6B] tracking-[0.03em]"></span>
        <button id="nextRevisionBtn" class="text-[#2D6A4F] hover:underline disabled:opacity-30 transition-colors text-[14px] font-medium">Next →</button>
      </div>
    </div>
  </div>
{% endblock %}

{% block page_scripts %}
  <script src="/static/js/bookmarks.js"></script>
{% endblock %}
