<!DOCTYPE html>
<html>
<head>
  <title>Processing</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#FAFAF8] flex items-center justify-center h-screen font-sans">

  <div class="text-center space-y-6">

    <!-- Spinner -->
    <div class="flex justify-center">
      <div class="w-16 h-16 border-4 border-[#2D6A4F] border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- Text -->
    <div>
      <h1 class="text-2xl font-serif text-[#1A1A1A]">
        Processing your content...
      </h1>
      <p id="statusText" class="text-gray-500 mt-2">
        Our AI is generating your notes
      </p>
    </div>

    <!-- Progress feel -->
    <div class="w-64 mx-auto">
      <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
        <div class="h-full bg-[#2D6A4F] animate-pulse w-2/3"></div>
      </div>
    </div>

    <p class="text-sm text-gray-400">
      This usually takes 10-30 seconds
    </p>

  </div>

<script>
async function runAI() {
  const text = sessionStorage.getItem("studyText") || localStorage.getItem("text") || "";
  const statusText = document.getElementById("statusText");

  if (!text.trim()) {
    statusText.innerText = "Add study material before starting AI processing.";
    return;
  }

  try {
    const response = await fetch("/process", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ text })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.detail || "Unable to process study material.");
    }

    sessionStorage.removeItem("studyText");
    localStorage.removeItem("text");
    window.location.href = `/result?result_id=${encodeURIComponent(data.result_id)}`;
  } catch (error) {
    statusText.innerText = error.message;
  }
}

runAI();
</script>

</body>
</html>
