<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nudge - Processing Material...</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Josefin+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons Engine CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Josefin Sans', sans-serif;
    }
    .font-serif {
      font-family: 'Instrument Serif', serif;
    }
    
    /* Smooth CSS Morphing Animation mimicking Framer Motion keyframes[cite: 9] */
    @keyframes morphBlob {
      0%, 100% {
        transform: scale(0.95);
        border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      }
      50% {
        transform: scale(1.05);
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      }
    }
    .animate-blob {
      animation: morphBlob 4s ease-in-out infinite;
    }

    /* Message Slide/Fade transition states[cite: 9] */
    .message-container h2, .message-container p {
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .text-enter-state {
      opacity: 0;
      transform: translateY(10px);
    }
    .text-active-state {
      opacity: 1;
      transform: translateY(0);
    }
    .text-exit-state {
      opacity: 0;
      transform: translateY(-10px);
    }
  </style>
</head>
<body class="bg-[#F4F4F2] text-[#1A1A1A] overflow-hidden select-none">

  <!-- Core Screen Centered Frame[cite: 9] -->
  <div class="h-screen w-full flex flex-col items-center justify-center relative">
    
    <!-- Header App Brand Logo Mark[cite: 9] -->
    <div class="absolute top-8 left-1/2 -translate-x-1/2 flex items-center gap-1">
      <span class="font-serif text-[20px] font-medium text-[#1A1A1A]">Nudge</span>
      <span class="w-[7px] h-[7px] rounded-full bg-[#2D6A4F] mb-[1px]"></span>
    </div>

    <!-- Main Central Card Stack[cite: 9] -->
    <div class="flex flex-col items-center max-w-[440px] w-full px-8 z-10">
      
      <!-- Organic Flowing Fluid Blob Canvas[cite: 9] -->
      <div class="relative mb-12">
        <div id="fluidBlob" class="w-[100px] h-[100px] bg-[#2D6A4F] animate-blob transition-all duration-500"></div>
        <!-- Inner Success Check Icon Overlay[cite: 9] -->
        <div id="successCheckWrapper" class="absolute inset-0 flex items-center justify-center scale-0 opacity-0 transition-all duration-500 ease-out">
          <i data-lucide="check" class="text-white w-8 h-8" stroke-width="3"></i>
        </div>
      </div>

      <!-- Rotating Dynamic Headlines Wrapper[cite: 9] -->
      <div class="h-[80px] flex flex-col items-center justify-center text-center mb-12 message-container w-full">
        <h2 id="processingMessage" class="font-serif text-[28px] font-medium text-[#1A1A1A] leading-tight text-enter-state">
          <!-- Populated Dynamically -->
        </h2>
        <p id="processingSubtext" class="text-[14px] text-[#6B6B6B] mt-2 text-enter-state">
          <!-- Populated Dynamically -->
        </p>
      </div>

      <!-- Step Horizontal Progression Timelines[cite: 9] -->
      <div class="w-full flex justify-between items-start relative mb-12">
        <!-- Baseline background line[cite: 9] -->
        <div class="absolute top-[13px] left-[13px] right-[13px] h-[1px] bg-[#E2E2E2] z-0"></div>

        <!-- Node 1: Reading[cite: 9] -->
        <div class="flex flex-col items-center gap-2 relative z-10 step-node" data-step-index="0">
          <div class="step-indicator-ring w-[26px] h-[26px] rounded-full flex items-center justify-center border-2 bg-[#F4F4F2] border-[#E2E2E2] transition-all duration-500">
            <i data-lucide="check" class="text-white w-3 h-3 hidden" stroke-width="3"></i>
          </div>
          <span class="step-label font-mono text-[10px] uppercase tracking-[0.03em] whitespace-nowrap text-[#6B6B6B]">
            Reading
          </span>
        </div>

        <!-- Node 2: Analyzing[cite: 9] -->
        <div class="flex flex-col items-center gap-2 relative z-10 step-node" data-step-index="1">
          <div class="step-indicator-ring w-[26px] h-[26px] rounded-full flex items-center justify-center border-2 bg-[#F4F4F2] border-[#E2E2E2] transition-all duration-500">
            <i data-lucide="check" class="text-white w-3 h-3 hidden" stroke-width="3"></i>
          </div>
          <span class="step-label font-mono text-[10px] uppercase tracking-[0.03em] whitespace-nowrap text-[#6B6B6B]">
            Analyzing
          </span>
        </div>

        <!-- Node 3: Structuring[cite: 9] -->
        <div class="flex flex-col items-center gap-2 relative z-10 step-node" data-step-index="2">
          <div class="step-indicator-ring w-[26px] h-[26px] rounded-full flex items-center justify-center border-2 bg-[#F4F4F2] border-[#E2E2E2] transition-all duration-500">
            <i data-lucide="check" class="text-white w-3 h-3 hidden" stroke-width="3"></i>
          </div>
          <span class="step-label font-mono text-[10px] uppercase tracking-[0.03em] whitespace-nowrap text-[#6B6B6B]">
            Structuring
          </span>
        </div>

        <!-- Node 4: Finalizing[cite: 9] -->
        <div class="flex flex-col items-center gap-2 relative z-10 step-node" data-step-index="3">
          <div class="step-indicator-ring w-[26px] h-[26px] rounded-full flex items-center justify-center border-2 bg-[#F4F4F2] border-[#E2E2E2] transition-all duration-500">
            <i data-lucide="check" class="text-white w-3 h-3 hidden" stroke-width="3"></i>
          </div>
          <span class="step-label font-mono text-[10px] uppercase tracking-[0.03em] whitespace-nowrap text-[#6B6B6B]">
            Finalizing
          </span>
        </div>
      </div>

      <!-- Interrupt Escape Button Action[cite: 9] -->
      <button
        onclick="handleCancelNavigation()"
        class="text-[13px] text-[#6B6B6B] hover:text-[#2D6A4F] transition-colors focus:outline-none"
      >
        Cancel and go back
      </button>

    </div>
  </div>  
  <script id="page-data" type="application/json">
  {{ page_data|tojson|safe }}
</script>

<script>
  window.PAGE_DATA = JSON.parse(
    document.getElementById("page-data").textContent
  );
</script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/processing.js"></script>
</body>
</html>
