<!DOCTYPE html>
<html>
<head>
  <title>Processing</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#FAFAF8] flex items-center justify-center h-screen font-sans">

  <div class="text-center space-y-6">

    <!-- Spinner -->
    <div class="flex justify-center">
      <div class="w-16 h-16 border-4 border-[#2D6A4F] border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- Text -->
    <div>
      <h1 class="text-2xl font-serif text-[#1A1A1A]">
        Processing your content...
      </h1>
      <p class="text-gray-500 mt-2">
        Our AI is generating your notes
      </p>
    </div>

    <!-- Progress feel -->
    <div class="w-64 mx-auto">
      <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
        <div class="h-full bg-[#2D6A4F] animate-pulse w-2/3"></div>
      </div>
    </div>

    <p class="text-sm text-gray-400">
      This usually takes 10–30 seconds
    </p>

  </div>

<script>
async function runAI() {
  const text = localStorage.getItem("text");

  const res = await fetch("/process", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  console.log("API DATA:", data);

  localStorage.setItem("result", JSON.stringify(data));

  window.location.href = "/result";
}

runAI();
</script>

</body>
</html>
