{% extends "base_app.html" %}
{% block title %}Nudge - Photosynthesis Quiz{% endblock %}

{% block page_styles %}
  <style>
body {
      font-family: 'Josefin Sans', sans-serif;
    }
    .font-serif {
      font-family: 'Instrument Serif', serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    
    /* Animation mappings mimicking the Framer Motion configuration[cite: 12] */
    .fade-in-slide {
      animation: fadeInSlide 0.25s ease-out forwards;
    }
    .fade-in-expand {
      animation: fadeInExpand 0.3s ease-out forwards;
    }
    
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInExpand {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
{% endblock %}

{% block content %}
<!-- Core Content Frame Wrapper[cite: 12] -->
  <div class="max-w-[720px] w-full mx-auto bg-white border border-[#E2E2E2] p-6 md:p-10 rounded-2xl shadow-sm">
    
    <!-- Top Progress Tracker & Timer Status Header[cite: 12] -->
    <div class="mb-8">
      <div class="flex items-center justify-between mb-3">
        <div>
          <p id="quizSubject" class="font-mono text-[11px] text-[#6B6B6B] uppercase tracking-[0.03em]">Quiz</p>
          <p id="quizTitle" class="text-[15px] font-medium text-[#1A1A1A]">Loading quiz...</p>
        </div>

        <span id="questionCounter" class="font-mono text-[14px] font-medium text-[#1A1A1A]">
          <!-- Injected dynamically -->
        </span>

        <div id="timerBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-full transition-colors duration-300">
          <i data-lucide="clock" class="w-3.5 h-3.5"></i>
          <span id="timerText" class="font-mono text-[13px] font-medium">10:00</span>
        </div>
      </div>

      <!-- Linear Tracker Timeline Track[cite: 12] -->
      <div class="h-[6px] bg-[#E2E2E2] rounded-full overflow-hidden">
        <div id="progressBarFill" class="h-full bg-[#2D6A4F] rounded-full transition-all duration-500 w-0"></div>
      </div>
    </div>

    <!-- Active Question Card Workspace View[cite: 12] -->
    <div id="questionWorkspace" class="fade-in-slide">
      <div class="mb-6">
        <span id="questionNumberPrefix" class="font-mono text-[17px] font-medium text-[#2D6A4F] tracking-[0.03em]"></span>
        <h2 id="questionTextDisplay" class="font-serif text-[22px] font-medium text-[#1A1A1A] leading-snug mt-1"></h2>
      </div>

      <!-- Option Cards Matrix List[cite: 12] -->
      <div id="optionsContainer" class="space-y-3 mb-6">
        <!-- Generated Dynamically -->
      </div>

      <!-- Contextual Explanation Wrapper Panel[cite: 12] -->
      <div id="explanationContainer" class="hidden">
        <!-- Rendered dynamically upon response validation submission -->
      </div>
    </div>

    <!-- Workflow Progression Footer Controls[cite: 12] -->
    <div class="flex items-center justify-between pt-6 border-t border-[#E2E2E2]">
      <button
        id="prevButton"
        onclick="navigateToPreviousQuestion()"
        class="flex items-center gap-2 text-[14px] text-[#6B6B6B] hover:text-[#2D6A4F] disabled:opacity-30 transition-colors font-medium focus:outline-none"
      >
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Previous
      </button>

      <div id="actionButtonWrapper">
        <!-- Mutates contextually between Submit, Next Question, or Finish[cite: 12] -->
      </div>
    </div>

  </div>
{% endblock %}

{% block page_scripts %}
  <script src="/static/js/quiz.js"></script>
{% endblock %}
