<!DOCTYPE html>
<html>
<head>
  <title>Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#FAFAF8] font-sans flex justify-center">

<!-- SIDEBAR -->
  <div class="w-64 h-screen bg-white border-r p-5 flex flex-col justify-between fixed left-0 top-0">

    <!-- TOP -->
    <div>
      <h1 class="text-xl font-serif mb-6">Nudge</h1>

      <nav class="space-y-2">
        <a href="/dashboard" class="block px-3 py-2 rounded-lg hover:bg-gray-100">Home</a>
        <a href="/mynotes" class="block px-3 py-2 rounded-lg hover:bg-gray-100">My Notes</a>
        <a href="#" class="block px-3 py-2 rounded-lg hover:bg-gray-100">Flashcards</a>
        <a href="#" class="block px-3 py-2 rounded-lg bg-[#E8F0EC] text-[#2D6A4F] font-medium">Quizzes</a>
        <a href="#" class="block px-3 py-2 rounded-lg hover:bg-gray-100">Progress</a>
        <a href="#" class="block px-3 py-2 rounded-lg hover:bg-gray-100">PYQ Analysis</a>
        <a href="#" class="block px-3 py-2 rounded-lg hover:bg-gray-100">Bookmarks</a>
        <a href="#" class="block px-3 py-2 rounded-lg hover:bg-gray-100">History</a>
        <a href="#" class="block px-3 py-2 rounded-lg hover:bg-gray-100">Export</a>
      </nav>
    </div>

    <!-- BOTTOM -->
    <div>
      <a href="#" class="block px-3 py-2 rounded-lg hover:bg-gray-100">Settings</a>

      <div class="mt-4 flex items-center gap-3">
        <div class="w-8 h-8 bg-[#2D6A4F] text-white rounded-full flex items-center justify-center">
          S
        </div>
        <div>
          <p class="text-sm font-medium">Siddharth</p>
          <a href="#" class="text-xs text-gray-500">Sign out</a>
        </div>
      </div>
    </div>

  </div>

<div class="max-w-2xl w-full mt-10 space-y-6">

  <!-- HEADER -->
  <div class="flex justify-between items-center">
    <h1 class="text-xl font-serif">Quiz</h1>
    <span id="progress" class="text-sm text-gray-500"></span>
  </div>

  <div class="w-full h-2 bg-gray-200 rounded">
    <div id="progressBar" class="h-2 bg-[#2D6A4F] rounded"></div>
  </div>

  <!-- TIMER -->
  <div class="text-right text-sm text-gray-500">
    Time: <span id="timer"></span>
  </div>

  <!-- QUESTION -->
  <h2 id="question" class="text-xl font-serif"></h2>

  <!-- OPTIONS -->
  <div id="options" class="space-y-3"></div>

  <!-- EXPLANATION -->
  <div id="explanation" class="hidden p-4 bg-[#F4F4F2] rounded-lg border text-sm text-gray-700"></div>

  <!-- BUTTONS -->
  <div class="flex justify-between pt-4">
    <button id="prevBtn" onclick="prev()" class="border px-4 py-2 rounded">Prev</button>

    <div class="flex gap-2">
      <button id="submitBtn" onclick="submitAnswer()" class="bg-[#2D6A4F] text-white px-6 py-2 rounded">
        Submit
      </button>

      <button id="nextBtn" onclick="next()" class="hidden bg-[#2D6A4F] text-white px-6 py-2 rounded">
        Next &rarr;
      </button>
    </div>
  </div>

</div>

<script id="quiz-result-id" type="application/json">{{ result_id | tojson }}</script>
<script id="quiz-questions-data" type="application/json">{{ quiz_questions | tojson }}</script>
<script>
const resultId = JSON.parse(document.getElementById("quiz-result-id").textContent);
let questions = JSON.parse(document.getElementById("quiz-questions-data").textContent);
let current = 0;
let selected = null;
let answers = {};
let answered = false;
let timeLeft = 600;
let timerHandle = null;

function getCorrectIndex(question) {
  if (typeof question.answer === "number") {
    return question.answer;
  }

  return question.options.findIndex(option =>
    option === question.answer || option.startsWith(question.answer)
  );
}

function updateTimer() {
  if (timeLeft > 0) {
    timeLeft--;
  }

  document.getElementById("timer").innerText =
    Math.floor(timeLeft / 60) + ":" + (timeLeft % 60).toString().padStart(2, "0");
}

function showEmptyState() {
  document.getElementById("question").innerText = "No quiz available";
  document.getElementById("progress").innerText = "";
  document.getElementById("timer").innerText = "0:00";
  document.getElementById("options").innerHTML =
    '<p class="text-sm text-gray-500">Generate study material with quiz questions to see them here.</p>';
  document.getElementById("prevBtn").style.display = "none";
  document.getElementById("submitBtn").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";
}

function loadQuiz() {
  if (!questions.length) {
    showEmptyState();
    return;
  }

  updateTimer();
  timerHandle = setInterval(updateTimer, 1000);
  render();
}

function render() {
  const question = questions[current];
  const correctIndex = getCorrectIndex(question);
  const optionsDiv = document.getElementById("options");
  const explanation = document.getElementById("explanation");
  const progressPercent = ((current + 1) / questions.length) * 100;

  document.getElementById("question").innerText = question.question;
  document.getElementById("progress").innerText = `Q ${current + 1} / ${questions.length}`;
  document.getElementById("progressBar").style.width = progressPercent + "%";
  document.getElementById("prevBtn").style.visibility = current === 0 ? "hidden" : "visible";

  optionsDiv.innerHTML = "";

  question.options.forEach((option, index) => {
    const optionCard = document.createElement("div");
    let classes = "p-4 rounded-xl border cursor-pointer transition-all hover:shadow-sm";

    if (!answered) {
      classes += selected === index
        ? " border-[#2D6A4F]"
        : " border-gray-200 hover:border-[#2D6A4F]";
      optionCard.innerText = option;
      optionCard.onclick = () => {
        selected = index;
        render();
      };
    } else {
      classes = "p-4 rounded-xl border transition-all";
      optionCard.style.pointerEvents = "none";

      if (index === correctIndex) {
        classes += " border-green-600 bg-green-50";
        optionCard.innerHTML = `&#10003; ${option}`;
      } else if (index === selected) {
        classes += " border-red-500 bg-red-50";
        optionCard.innerHTML = `&#10007; ${option}`;
      } else {
        classes += " border-gray-200 opacity-60";
        optionCard.innerText = option;
      }
    }

    optionCard.className = classes;
    optionsDiv.appendChild(optionCard);
  });

  if (answered) {
    explanation.innerHTML = `
      <div class="flex gap-2 items-start">
        <span class="text-[#2D6A4F] font-bold">&#10003;</span>
        <div>
          <p class="font-semibold text-[#1A1A1A]">Explanation</p>
          <p class="text-sm text-gray-600 mt-1">
            ${question.explanation || "No explanation available"}
          </p>
        </div>
      </div>
    `;
    explanation.classList.remove("hidden");
  } else {
    explanation.classList.add("hidden");
  }

  document.getElementById("submitBtn").style.display = answered ? "none" : "block";
  document.getElementById("nextBtn").style.display = answered ? "block" : "none";
}

function submitAnswer() {
  if (selected === null) {
    alert("Please select an option");
    return;
  }

  answers[current] = selected;
  answered = true;
  render();
}

function next() {
  if (!answered) {
    return;
  }

  if (current < questions.length - 1) {
    current++;
    selected = answers[current] ?? null;
    answered = answers[current] !== undefined;
    render();
    return;
  }

  finish();
}

function prev() {
  if (current === 0) {
    return;
  }

  current--;
  selected = answers[current] ?? null;
  answered = answers[current] !== undefined;
  render();
}

function finish() {
  if (timerHandle) {
    clearInterval(timerHandle);
  }

  const params = new URLSearchParams();
  if (resultId) {
    params.set("result_id", resultId);
  }
  params.set("answers", JSON.stringify(answers));
  window.location.href = "/quiz-result?" + params.toString();
}

window.onload = loadQuiz;
</script>

</body>
</html>
